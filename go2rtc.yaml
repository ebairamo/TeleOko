# API настройки
api:
  listen: :1984
  origin: "*"

# WebRTC настройки - принудительный relay
webrtc:
  listen: :1984
  
  # Отключаем локальные кандидаты полностью
  candidates: []
  
  # ICE серверы только с TURN relay
  ice_servers:
    - urls:
      - turn:openrelay.metered.ca:80
      username: openrelayproject
      credential: openrelayproject
    - urls:
      - turn:openrelay.metered.ca:443
      username: openrelayproject  
      credential: openrelayproject
    - urls:
      - turn:openrelay.metered.ca:443?transport=tcp
      username: openrelayproject
      credential: openrelayproject

# RTSP сервер
rtsp:
  listen: :8554